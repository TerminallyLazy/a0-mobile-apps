<html><head><title>Get Agent Zero for Android</title><script type="module" src="/plugins/mobile_apps/webui/android-app-store.js"></script></head>
<body><div x-data><template x-if="$store.mobileAppsStore"><div class="android-install" x-data="$store.mobileAppsStore.createModel()" x-create="onOpen($el)" x-destroy="cleanup()">
  <header class="android-install-hero"><img src="/plugins/mobile_apps/webui/logo.webp" width="44" height="44" alt="Agent Zero"><div><h2>Your workspace. On Android.</h2><p>Install the free app, then connect to this Agent Zero server.</p><span class="android-install-beta">Public beta · Android 8.0+</span></div></header>
  <div class="android-install-grid">
    <section class="android-install-step"><h3>1. Download on your phone</h3><p>Scan with your phone’s camera to open the install page. On Android, tap Download APK below.</p><div class="android-install-qr" data-android-qr="install" role="img" aria-label="QR code for the Android installation page"></div><a class="btn btn-ok android-install-link" :href="apk" rel="noreferrer">Download APK <x-icon name="download" aria-hidden="true"></x-icon></a><a :href="installUrl" target="_blank" rel="noopener noreferrer">Installation help</a><p class="android-install-small">Open AgentZero.apk. If asked, allow installation from your browser, then tap Install.</p></section>
    <section class="android-install-step"><h3>2. Connect this server</h3><p x-show="loading">Checking your HTTPS address…</p><div x-show="!loading && server"><p>In the app, choose <strong>Scan QR code</strong> and scan this code. Already on Android? Tap Open in Android.</p><div class="android-install-qr" data-android-qr="connect" role="img" aria-label="QR code containing this server’s HTTPS address"></div><a class="btn btn-ok android-install-link" :href="openUrl">Open in Android <x-icon name="open_in_new" aria-hidden="true"></x-icon></a><code class="android-install-address" x-text="server"></code><p class="android-install-small">Review the address, tap Connect, then sign in on your server’s page.</p></div><div x-show="!loading && !server"><p>Create an HTTPS link in <strong>Remote Control</strong>, then reopen this dialog. You can also enter your trusted HTTPS server address directly in the app.</p><p>Localhost and HTTP addresses cannot connect a phone to this computer.</p></div></section>
  </div>
  <p class="android-install-ios">Using an iPhone or iPad? <a href="https://testflight.apple.com/join/xqAFS5er" target="_blank" rel="noopener noreferrer">Get the iOS public beta ↗</a></p>
  <p class="android-install-note">Your server provides the chats and tools. These codes contain addresses only; you still sign in normally. Install directly—no app store account needed.</p>
</div></template></div></body>
<style>
.android-install{padding:8px}.android-install-hero{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}.android-install-hero>img{border-radius:10px;flex-shrink:0}.android-install-ios{padding-top:18px;border-top:1px solid var(--color-border)}.android-install h2{font-size:1.55rem;margin:0 0 8px}.android-install p{line-height:1.6;margin:8px 0 16px;color:var(--color-text-secondary)}.android-install-beta{font-size:.78rem;border:1px solid var(--color-border);border-radius:20px;padding:5px 10px}.android-install-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.android-install-step{padding:22px;border:1px solid var(--color-border);border-radius:16px;background:var(--color-panel);min-width:0}.android-install h3{font-size:1.15rem;margin:10px 0}.android-install-qr{background:#fff;padding:12px;border-radius:12px;width:184px;height:184px;margin:20px auto}.android-install-qr:empty{display:none}.android-install-qr img,.android-install-qr canvas{width:160px;height:160px}.android-install-link{display:flex!important;justify-content:center;align-items:center;gap:12px;min-height:48px;text-decoration:none!important;margin:16px 0}.android-install-step>a:not(.btn){display:block;text-align:center}.android-install-address{display:block;font-size:.8rem;overflow-wrap:anywhere;white-space:normal;text-align:center;margin-top:16px}.android-install .android-install-small,.android-install .android-install-note{font-size:.8rem}.android-install-note{margin-top:22px!important}@media(max-width:600px){.android-install-grid{grid-template-columns:1fr}.android-install{padding:0}.android-install-hero{gap:12px}.android-install-step{padding:18px}}
</style></html>
