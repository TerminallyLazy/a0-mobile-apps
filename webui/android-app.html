<html>
<head>
  <title>Get Agent Zero on your phone</title>
  <script type="module" src="/plugins/mobile_apps/webui/android-app-store.js"></script>
</head>
<body>
<div x-data><template x-if="$store.mobileAppsStore">
  <div class="mobile-install" x-data="$store.mobileAppsStore.createModel()" x-create="onOpen($el)" x-destroy="cleanup()">
    <header class="mobile-install-hero">
      <img src="/plugins/mobile_apps/webui/logo.webp" width="52" height="52" alt="">
      <div><h2>Your workspace. On your phone.</h2><p>Scan a code with your phone’s camera, or download below.</p></div>
    </header>
    <div class="mobile-install-platforms">
      <section class="mobile-install-platform" aria-labelledby="mobile-android-title">
        <h3 id="mobile-android-title"><x-icon name="android" aria-hidden="true"></x-icon>Android</h3>
        <p class="mobile-install-meta">Public beta · Android 8.0+</p>
        <div class="mobile-install-platform-body">
          <div class="mobile-install-qr" data-mobile-qr="install" role="img" aria-label="QR code for the Android installation page"></div>
          <div class="mobile-install-platform-copy">
            <p>Install Agent Zero directly on your Android phone.</p>
            <a class="button mobile-install-download" :href="apk" rel="noreferrer"><x-icon name="download" aria-hidden="true"></x-icon>Download APK</a>
            <p class="mobile-install-small">Open the APK. Allow installation from your browser if asked.</p>
            <a class="mobile-install-help" :href="installUrl" target="_blank" rel="noopener noreferrer">Installation help <x-icon name="arrow_outward" aria-hidden="true"></x-icon></a>
          </div>
        </div>
      </section>
      <section class="mobile-install-platform" aria-labelledby="mobile-ios-title">
        <h3 id="mobile-ios-title"><svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M17.05 12.04c.02 3.06 2.69 4.08 2.72 4.09-.02.07-.43 1.46-1.41 2.9-.85 1.24-1.73 2.48-3.12 2.5-1.37.03-1.81-.81-3.38-.81-1.56 0-2.05.78-3.35.84-1.34.05-2.36-1.34-3.21-2.58-1.75-2.53-3.09-7.16-1.29-10.28.89-1.55 2.49-2.53 4.23-2.56 1.32-.03 2.57.89 3.38.89.81 0 2.33-1.1 3.92-.94.66.03 2.52.27 3.72 2.02-.1.06-2.22 1.29-2.21 3.93M14.46 4.42c.71-.86 1.19-2.06 1.06-3.25-1.02.04-2.25.68-2.98 1.53-.65.75-1.22 1.96-1.06 3.11 1.13.09 2.28-.57 2.98-1.39"/></svg>iPhone &amp; iPad</h3>
        <p class="mobile-install-meta">Public beta · Apple TestFlight</p>
        <div class="mobile-install-platform-body">
          <div class="mobile-install-qr" data-mobile-qr="ios" role="img" aria-label="QR code for the iOS public beta on TestFlight"></div>
          <div class="mobile-install-platform-copy">
            <p>Get Agent Zero for iOS through the public beta.</p>
            <a class="button mobile-install-download" :href="iosBeta" target="_blank" rel="noopener noreferrer"><x-icon name="open_in_new" aria-hidden="true"></x-icon>Join the iOS beta</a>
            <p class="mobile-install-small">Install Apple’s TestFlight app if prompted, then accept the invitation.</p>
          </div>
        </div>
      </section>
    </div>
    <section class="mobile-install-connection" aria-labelledby="mobile-connect-title">
      <h3 id="mobile-connect-title">Next, connect your server</h3>
      <p x-show="loading" role="status">Checking your HTTPS address…</p>
      <div x-show="!loading && server" x-cloak>
        <p>Use this address in either app, then sign in as usual.</p>
        <div class="mobile-install-address-row">
          <code class="mobile-install-address" x-text="server"></code>
          <button type="button" class="button mobile-install-copy" @click="copyServer()" :disabled="copying" :aria-label="copied ? 'Server address copied' : 'Copy server address'">
            <x-icon :name="copied ? 'check' : 'content_copy'" aria-hidden="true"></x-icon><span x-text="copied ? 'Copied' : 'Copy address'" aria-live="polite"></span>
          </button>
        </div>
        <div class="mobile-install-connect-options">
          <details class="mobile-install-pairing">
            <summary><x-icon name="qr_code_2" aria-hidden="true"></x-icon>Connect with a QR code<x-icon class="mobile-install-chevron" name="expand_more" aria-hidden="true"></x-icon></summary>
            <div class="mobile-install-pairing-body">
              <div class="mobile-install-qr" data-mobile-qr="connect" role="img" aria-label="QR code containing this server’s HTTPS address"></div>
              <p>In the Android app, choose <strong>Scan QR code</strong>. Scan this code, review the address, then connect.</p>
            </div>
          </details>
          <a class="mobile-install-open" :href="openUrl">Open in Android <x-icon name="open_in_new" aria-hidden="true"></x-icon></a>
        </div>
      </div>
      <div x-show="!loading && !server" x-cloak>
        <p>Create an HTTPS link in <strong>Remote Control</strong>, then reopen this dialog. You can also enter your trusted HTTPS server address directly in either app.</p>
        <p class="mobile-install-small">Localhost and HTTP addresses cannot connect a phone to this computer.</p>
      </div>
    </section>
    <p class="mobile-install-note">QR codes are generated in your browser. Your server provides your chats and tools.</p>
  </div>
</template></div>
</body>
<style>
.mobile-install { padding: 8px; container-type: inline-size; }
.mobile-install-hero { display: flex; gap: 16px; align-items: center; margin-bottom: 32px; }
.mobile-install-hero > img { border-radius: 12px; flex-shrink: 0; }
.mobile-install h2 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 6px; }
.mobile-install h3 { display: flex; align-items: center; gap: 10px; font-size: 1.125rem; line-height: 1.4; margin: 0; }
.mobile-install h3 x-icon { font-size: 24px; }
.mobile-install h3 svg { width: 23px; height: 23px; flex-shrink: 0; }
.mobile-install p { font-size: .9375rem; line-height: 1.55; margin: 0; color: var(--color-text-muted); }
.mobile-install-platforms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mobile-install-platform { min-width: 0; padding-right: 24px; }
.mobile-install-platform + .mobile-install-platform { padding: 0 0 0 24px; border-left: 1px solid var(--color-border); }
.mobile-install .mobile-install-meta { font-size: .8rem; margin: 4px 0 20px 34px; }
.mobile-install-platform-body { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 20px; align-items: start; }
.mobile-install-qr { box-sizing: content-box; background: #fff; padding: 18px; border-radius: 10px; width: 144px; height: 144px; flex-shrink: 0; }
.mobile-install-qr:empty { display: none; }
.mobile-install-qr img, .mobile-install-qr canvas { width: 144px; height: 144px; }
.mobile-install-platform-copy { min-width: 0; }
.mobile-install .mobile-install-download { gap: 8px; min-height: 44px; padding: 10px 14px; margin: 16px 0 12px; color: var(--color-text); background: var(--color-panel); border-color: var(--color-border); white-space: nowrap; text-decoration: none; }
.mobile-install .mobile-install-small { font-size: .8125rem; }
.mobile-install-download x-icon, .mobile-install-copy x-icon, .mobile-install-open x-icon, .mobile-install-help x-icon { font-size: 18px; }
.mobile-install-help { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-size: .8125rem; }
.mobile-install-connection { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--color-border); }
.mobile-install-connection h3 { font-size: 1rem; margin-bottom: 6px; }
.mobile-install-address-row { display: flex; align-items: center; gap: 16px; margin-top: 14px; padding: 4px 4px 4px 14px; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-panel); }
.mobile-install-address { flex: 1; min-width: 0; font-size: .8125rem; line-height: 1.6; overflow-wrap: anywhere; white-space: normal; user-select: all; }
.mobile-install .mobile-install-copy { gap: 8px; min-height: 44px; padding: 8px 12px; min-width: 142px; flex-shrink: 0; background: transparent; border-color: transparent; }
.mobile-install-copy:disabled { cursor: progress; opacity: .6; }
.mobile-install-connect-options { display: flex; align-items: flex-start; justify-content: space-between; column-gap: 20px; margin-top: 4px; }
.mobile-install-pairing { flex: 1; min-width: 0; }
.mobile-install-pairing summary { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: .8125rem; cursor: pointer; list-style: none; border-radius: 4px; }
.mobile-install-pairing summary::-webkit-details-marker { display: none; }
.mobile-install-pairing summary x-icon { font-size: 18px; }
.mobile-install-pairing[open] .mobile-install-chevron { transform: rotate(180deg); }
.mobile-install-pairing-body { display: flex; align-items: center; gap: 20px; padding: 12px 0 8px; }
.mobile-install-pairing-body p { max-width: 28em; }
.mobile-install-open { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: .8125rem; white-space: nowrap; }
.mobile-install .mobile-install-note { font-size: .75rem; margin-top: 18px; }
.mobile-install :is(a, button, summary):focus-visible { outline: 2px solid var(--color-highlight); outline-offset: 3px; }
.mobile-install-pairing summary:hover { color: var(--color-highlight); }
@container (max-width: 800px) {
  .mobile-install-platforms { grid-template-columns: 1fr; gap: 24px; }
  .mobile-install-platform { padding: 0; }
  .mobile-install-platform + .mobile-install-platform { padding: 24px 0 0; border-left: 0; border-top: 1px solid var(--color-border); }
  .mobile-install-platform-body { grid-template-columns: 180px minmax(0, 1fr); gap: 24px; }
  .mobile-install-platform-copy { max-width: 26em; }
}
@container (max-width: 440px) {
  .mobile-install-hero { gap: 12px; align-items: flex-start; margin-bottom: 24px; }
  .mobile-install-hero > img { width: 44px; height: 44px; }
  .mobile-install h2 { font-size: 1.25rem; }
  .mobile-install-platform-body { grid-template-columns: 1fr; gap: 18px; }
  .mobile-install-qr { justify-self: center; }
  .mobile-install-platform-copy { text-align: center; }
  .mobile-install .mobile-install-meta { margin-bottom: 16px; }
  .mobile-install-address-row { flex-direction: column; align-items: stretch; gap: 4px; padding: 12px 12px 4px; }
  .mobile-install .mobile-install-copy { align-self: flex-start; margin-left: -8px; }
  .mobile-install-connect-options { flex-direction: column; gap: 0; }
  .mobile-install-pairing-body { flex-direction: column; align-items: flex-start; }
  .mobile-install-pairing-body > .mobile-install-qr { align-self: center; }
}
@media (prefers-reduced-motion: reduce) {
  .mobile-install .button { transition: none; }
}
</style>
</html>
